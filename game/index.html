<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emberfall Arena</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0b1e;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      canvas {
        width: min(100vw, calc(100vh * (1280 / 720)));
        height: min(100vh, calc(100vw * (720 / 1280)));
        display: block;
        background: #0d0b1e;
        cursor: crosshair;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720"></canvas>
    <p id="status" class="sr-only" aria-live="polite"></p>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
